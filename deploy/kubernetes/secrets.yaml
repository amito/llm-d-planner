apiVersion: v1
kind: Secret
metadata:
  name: planner-secrets
  namespace: planner
  labels:
    app.kubernetes.io/part-of: planner
type: Opaque
stringData:
  postgres-password: changeme
  # HuggingFace token (required for capacity planner / GPU recommender with gated models)
  hf-token: ""
  # Model Catalog bearer token (only needed when PLANNER_BENCHMARK_SOURCE=model_catalog)
  # On OpenShift, can use the ServiceAccount token instead
  model-catalog-token: ""
  # Vertex AI credentials (only needed when LLM_PROVIDER=vertex)
  vertex-project-id: ""
  vertex-region: ""
  gcp-credentials-json: ""
  # OpenAI-compatible API credentials (only needed when LLM_PROVIDER=openai)
  openai-api-key: ""
  openai-base-url: ""
  db-admin-password: ""
