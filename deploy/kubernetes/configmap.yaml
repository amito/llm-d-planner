apiVersion: v1
kind: ConfigMap
metadata:
  name: planner-config
  namespace: planner
  labels:
    app.kubernetes.io/part-of: planner
data:
  # LLM provider: "ollama" (default), "vertex" (Claude on Vertex AI), or "openai" (any OpenAI-compatible API)
  LLM_PROVIDER: ollama
  # Model name for any provider. Empty = provider default (ollama: qwen2.5:7b, vertex: claude-sonnet-4-6, openai: gpt-4o)
  LLM_MODEL: ""

  # Benchmark data source: "postgresql" (default) or "model_catalog" (RHOAI)
  PLANNER_BENCHMARK_SOURCE: postgresql

  # Model Catalog connection (only used when PLANNER_BENCHMARK_SOURCE=model_catalog)
  MODEL_CATALOG_URL: https://model-catalog.rhoai-model-registries.svc:8443
  MODEL_CATALOG_SOURCE_ID: redhat_ai_validated_models
  MODEL_CATALOG_VERIFY_SSL: "true"
  # Path to the OpenShift service-serving CA bundle (mounted via service-ca ConfigMap)
  MODEL_CATALOG_CA_BUNDLE: /etc/pki/service-ca/service-ca.crt
