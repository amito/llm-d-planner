apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: planner
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: planner
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: planner-backend
      containers:
        - name: backend
          image: quay.io/llm-d-planner/llm-d-planner-backend:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: planner-config
          env:
            - name: PLANNER_DB_PATH
              value: /app/db/planner.db
            - name: MODEL_CATALOG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: model-catalog-token
                  optional: true
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: hf-token
                  optional: true
            - name: OLLAMA_HOST
              value: http://ollama:11434
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: planner-config
                  key: LLM_MODEL
                  optional: true
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: planner-config
                  key: LLM_PROVIDER
            - name: VERTEX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: vertex-project-id
                  optional: true
            - name: VERTEX_REGION
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: vertex-region
                  optional: true
            - name: GCP_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: gcp-credentials-json
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: openai-api-key
                  optional: true
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: openai-base-url
                  optional: true
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: vertex-project-id
                  optional: true
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: db-admin-password
                  optional: true
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
            - name: CORS_ORIGINS
              value: "*"
          volumeMounts:
            - name: planner-data
              mountPath: /app/db
            - name: service-ca
              mountPath: /etc/pki/service-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: planner-data
          persistentVolumeClaim:
            claimName: planner-data-pvc
        - name: service-ca
          configMap:
            name: planner-service-ca
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: planner
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: planner
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planner-data-pvc
  namespace: planner
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: planner
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
