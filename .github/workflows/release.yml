name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs full history to derive version from tags
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv build
      - name: Verify built version matches tag
        run: |
          WHEEL=$(ls dist/*.whl)
          WHEEL_VERSION=$(basename "$WHEEL" | cut -d'-' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$WHEEL_VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: Wheel version ($WHEEL_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $WHEEL_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            echo "Release ${{ github.ref_name }} already exists, uploading assets"
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* --generate-notes
          fi

  # Publishes to PyPI using Trusted Publishing (OIDC).
  # Prerequisites: configure "pypi" environment in repo settings,
  # and register this workflow as a trusted publisher on pypi.org.
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-status:
    if: always()
    needs: [release, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check release status
        run: |
          if [[ "${{ needs.release.result }}" != "success" ||
                "${{ needs.publish.result }}" != "success" ]]; then
            echo "Release pipeline failed: release=${{ needs.release.result }}, publish=${{ needs.publish.result }}"
            exit 1
          fi
          echo "Release pipeline completed successfully"
